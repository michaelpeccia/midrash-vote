<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}

  var(--bg);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(28deg)}}
#sparks{position:fixed;inset:0;z-index:-1;pointer-events:none}
#confetti{position:fixed;inset:0;z-index:50;pointer-events:none}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px}
header{text-align:center;padding:10px 0 6px}
.kicker{font-family:Cinzel,serif;letter-spacing:.32em;font-size:12px;color:var(--gold);font-weight:600}

h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(30px,8.5vw,46px);line-height:1.05;
  background:linear-gradient(100deg,#fff 0%,var(--gold2) 40%,#d7c2ff 70%,#fff 100%);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{color:var(--muted);margin-top:8px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 14px;border-radius:99px;font-weight:800;font-size:12px;letter-spacing:.14em;

.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;animation:pulse 1.4s infinite}
.pill.vote{background:rgba(61,220,151,.13);color:var(--good);border-color:rgba(61,220,151,.5)}
.pill.live{background:rgba(255,59,92,.15);color:#ff6b84;border-color:rgba(255,59,92,.55)}
.pill.results{background:rgba(123,63,228,.2);color:#d7c2ff;border-color:rgba(160,120,255,.55)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.count-card{text-align:center;background:linear-gradient(160deg,rgba(123,63,228,.28),rgba(47,123,255,.16));border-color:rgba(190,160,255,.3);box-shadow:0 20px 60px -20px rgba(123,63,228,.6)}
.count-label{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.count-target{font-size:14px;color:var(--gold2);margin-top:6px;font-weight:600}
.clock{display:flex;justify-content:center;gap:8px;margin-top:14px}
.unit{min-width:66px}
.digit{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(30px,10vw,44px);
  padding:12px 6px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 -10px 20px rgba(0,0,0,.3),0 0 24px rgba(245,197,66,.12);color:#fff}
.digit.tick{animation:tick .45s ease}
@keyframes tick{0%{transform:translateY(-6px);opacity:.3;color:var(--gold2)}100%{transform:none;opacity:1}}
.unit small{display:block;margin-top:6px;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

.steps{display:flex;gap:6px;margin-top:18px}

h2{font-family:Cinzel,serif;font-size:22px;margin-bottom:6px}

textarea,input[type=text]{width:100%;margin-top:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);border-radius:14px;color:#fff;
  font:inherit;font-size:16px;padding:14px;outline:none;transition:.2s;resize:none}
textarea{min-height:96px}
textarea:focus,input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,197,66,.15)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:16px;border:0;border-radius:16px;cursor:pointer;
  font:inherit;font-weight:800;font-size:16px;color:#1b1206;background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,#e0a91f);
  box-shadow:0 10px 30px -8px rgba(245,197,66,.6);transition:transform .15s}

.btn[disabled]{opacity:.5;cursor:default}

.btn.sm{width:auto;padding:9px 14px;font-size:13px;margin-top:0;border-radius:12px}
.notice{margin-top:14px;padding:14px;border-radius:14px;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35);font-size:14px;line-height:1.45}

.list{display:flex;flex-direction:column;gap:10px}
.item{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.item .t{font-weight:600;font-size:15px;line-height:1.4}
.item .by{font-size:12px;color:var(--muted);margin-top:4px}

.opt{position:relative;overflow:hidden;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;padding:16px 16px 16px 52px;border-radius:18px;
  background:rgba(255,255,255,.06);border:1.5px solid var(--line);transition:.2s}
.opt:active{transform:scale(.985)}
.opt .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,rgba(123,63,228,.45),rgba(47,123,255,.3));transition:width 1s cubic-bezier(.2,.8,.2,1);z-index:0}
.opt>*{position:relative;z-index:1}
.opt .radio{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:13px}
.opt .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.opt .pct{font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt.mine{border-color:var(--gold);box-shadow:0 0 24px rgba(245,197,66,.3)}
.opt.mine .radio{background:var(--gold);border-color:var(--gold);color:#1b1206}
.opt.mine .fill{background:linear-gradient(90deg,rgba(245,197,66,.45),rgba(245,197,66,.15))}
.total{text-align:center;margin-top:14px;color:var(--muted);font-size:13px}

.winner{text-align:center;padding:26px 18px;border-radius:24px;margin-top:6px;position:relative;
  background:radial-gradient(120% 120% at 50% 0%,rgba(245,197,66,.32),rgba(123,63,228,.25) 55%,rgba(0,0,0,.2));
  border:1.5px solid rgba(245,197,66,.6);box-shadow:0 0 60px -10px rgba(245,197,66,.55)}
.winner .crown{font-size:44px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.winner .lbl{font-size:12px;letter-spacing:.22em;color:var(--gold2);font-weight:800;text-transform:uppercase;margin-top:6px}
.winner .topic{font-family:Cinzel,serif;font-size:clamp(22px,6.5vw,30px);margin-top:10px;line-height:1.25}
.winner .v{color:var(--muted);margin-top:10px;font-size:14px}

.links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.links a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;text-decoration:none;color:#fff;font-weight:800;font-size:13px;border:1px solid var(--line)}
.links a span{font-size:22px}
.yt{background:linear-gradient(160deg,#ff3b3b,#a10f0f)}
.fb{background:linear-gradient(160deg,#3b82f6,#1e3a8a)}
.zm{background:linear-gradient(160deg,#4f8cff,#2d55c9)}

.livebig{text-align:center}
.livebig .rec{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:28px;letter-spacing:.12em;color:#ff6b84}
.livebig .rec i{width:16px;height:16px;border-radius:50%;background:var(--live);box-shadow:0 0 22px var(--live);animation:pulse 1.1s infinite}

.share{margin-top:18px}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:30px;line-height:1.7}
footer .so{color:var(--ink)}
footer button{background:none;border:0;color:rgba(255,255,255,.3);font:inherit;font-size:12px;margin-top:14px;cursor:pointer;text-decoration:underline}
.demo{position:sticky;top:0;z-index:20;background:rgba(245,197,66,.95);color:#1b1206;font-size:12px;font-weight:600;padding:8px 12px;text-align:center}
.demo .sw{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.demo button{border:0;border-radius:99px;padding:5px 10px;font:inherit;font-size:12px;font-weight:800;background:#1b1206;color:var(--gold2);cursor:pointer}
.demo button.on{background:#fff;color:#1b1206}
.admin{border-color:rgba(255,107,132,.4)}
.admin .arow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.admin .arow .t{flex:1;font-size:14px}
.admin .arow.hid .t{opacity:.4;text-decoration:line-through}
.admin label{display:flex;gap:10px;align-items:center;font-weight:600;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#fff;color:#1b1206;font-weight:800;padding:12px 18px;border-radius:99px;z-index:60;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center;opacity:0;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
div.opt{padding-left:16px;cursor:default}
.empty{text-align:center;color:var(--muted);padding:18px;font-size:14px}
.loading{text-align:center;color:var(--muted);padding:30px}
</style>
</head>

</div>

<script type="module">
/* =====================================================================
   SETTINGS: the only part you need to edit
   ===================================================================== */
const CONFIG = {
  // Paste your Firebase web config here (see the setup note).
  // While apiKey still says PASTE, the page runs in preview mode with sample topics.
  firebase: {
    apiKey: "AIzaSyD8uJCk6souUrMLbob-2V9qJUNfYwUJnvo",
    authDomain: "midrash-vote.firebaseapp.com",
    projectId: "midrash-vote",
    appId: "1:946166814619:web:d33829e996eba426c9333e"
  },
  adminEmail: "michaelpeccia@gmail.com",   // the Google account that can moderate
  firstTopicSaturday: "2026-11-07",       // any Saturday that IS a topic Midrash (YYYY-MM-DD)
  everyWeeks: 1,                          // 1 = topic Midrash every week, 2 = every other week
  liveStart: [18, 30],                    // Saturday 6:30 PM CT
  liveEnd: [20, 30],                      // when the "We're live" screen switches to the next round
  maxSuggestionsPerPerson: 2,
  links: {
    youtube: "https://www.youtube.com/@MichaelBenYahKingdomLife777",
    facebook: "https://www.facebook.com/Kingdomlifeministry777",
    zoom: "https://us06web.zoom.us/j/83025094199?pwd=1VgVrWPp2doQNnlbyJi50BICEi8zA5.1"
  }
};
/* ===================================================================== */

const TZ = "America/Chicago";
const DEMO = !CONFIG.firebase.apiKey || CONFIG.firebase.apiKey.startsWith("PASTE");
const $ = s => document.querySelector(s);

/* ---------- small DOM helper (textContent only, safe for user text) ---------- */
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- Central Time math ---------- */
const fmtParts = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hourCycle: "h23",
  year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function ctParts(ms) {
  const o = {}; for (const p of fmtParts.formatToParts(new Date(ms))) o[p.type] = +p.value;
  if (o.hour === 24) o.hour = 0;
  return o;
}
function offsetMin(ms) {
  const p = ctParts(ms);
  return (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(ms / 1000) * 1000) / 60000;
}
function ctToMs(dayNum, hh, mm) { // dayNum = days since epoch for a Chicago calendar date
  const guess = dayNum * 86400000 + (hh * 60 + mm) * 60000;
  let t = guess - offsetMin(guess) * 60000;
  const o2 = offsetMin(t); t = guess - o2 * 60000;
  return t;
}
const dayFromISO = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
const isoFromDay = n => new Date(n * 86400000).toISOString().slice(0, 10);
const todayCT = ms => { const p = ctParts(ms); return Date.UTC(p.year, p.month - 1, p.day) / 86400000; };
const fmtDay = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
const dayLabel = n => fmtDay.format(new Date(n * 86400000));

function computeCycle(now) {
  const A = dayFromISO(CONFIG.firstTopicSaturday), C = 7 * CONFIG.everyWeeks;
  const liveEndOf = S => ctToMs(S, ...CONFIG.liveEnd);
  let S = A + Math.floor((todayCT(now) - A) / C) * C;
  while (liveEndOf(S) <= now) S += C;
  while (liveEndOf(S - C) > now) S -= C;
  const c = {
    id: isoFromDay(S), sat: S,
    suggestStart: liveEndOf(S - C),
    voteStart: ctToMs(S - 3, 18, 0),
    voteEnd: ctToMs(S - 2, 18, 0),
    liveStart: ctToMs(S, ...CONFIG.liveStart),
    liveEnd: liveEndOf(S)
  };
  c.phase = now < c.voteStart ? "suggest" : now < c.voteEnd ? "vote" : now < c.liveStart ? "results" : "live";
  return c;
}

/* ---------- backends ---------- */
function demoBackend() {
  const KEY = "klm-vote-demo-v1";
  let db; try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
  db = db || { settings: { paused: false, message: "" }, cycles: {} };
  const uid = "demo-me";
  const subs = { s: [], v: [], set: [] };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  const seed = id => {
    if (db.cycles[id]) return db.cycles[id];
    const samples = [
      ["Forgiving someone who never said sorry", "Tanya"],
      ["Acts 10: did Peter's vision cancel the food laws?", "Marcus"],
      ["What does it mean to be grafted in?", ""],
      ["Can a believer be oppressed by demons?", "Joy"],
      ["Where do Christmas and Easter really come from?", "Daniel"],
      ["Husbands love, wives submit: what does it really mean?", ""]
    ];
    const t0 = Date.now() - 86400000;
    const s = samples.map(([text, name], i) => ({ id: "s" + i, text, name, uid: "u" + i, hidden: false, createdAt: t0 + i * 3600000 }));
    const v = {}; const weights = [9, 6, 4, 7, 3, 5];
    let n = 0; weights.forEach((w, i) => { for (let k = 0; k < w; k++) v["fake" + (n++)] = { sid: "s" + i }; });
    return (db.cycles[id] = { s, v });
  };
  const emit = id => {
    const c = seed(id);
    subs.s.forEach(f => f.id === id && f.cb(c.s.filter(x => !x.hidden || f.admin)));
    subs.v.forEach(f => f.id === id && f.cb({ ...c.v }));
  };
  return {
    demo: true,
    init: async onUser => onUser({ uid, isAdmin: false }),
    onSettings: cb => { subs.set.push(cb); cb(db.settings); },
    onSuggestions: (id, admin, cb) => { const f = { id, admin, cb }; subs.s.push(f); emit(id); return () => subs.s.splice(subs.s.indexOf(f), 1); },
    onVotes: (id, cb) => { const f = { id, cb }; subs.v.push(f); emit(id); return () => subs.v.splice(subs.v.indexOf(f), 1); },
    addSuggestion: async (id, text, name) => { seed(id).s.push({ id: "s" + Date.now(), text, name, uid, hidden: false, createdAt: Date.now() }); save(); emit(id); },
    vote: async (id, sid) => { seed(id).v[uid] = { sid }; save(); emit(id); },
    setHidden: async (id, sid, hidden) => { const x = seed(id).s.find(s => s.id === sid); if (x) x.hidden = hidden; save(); emit(id); },
    remove: async (id, sid) => { const c = seed(id); c.s = c.s.filter(s => s.id !== sid); save(); emit(id); },
    saveSettings: async st => { db.settings = { ...db.settings, ...st }; save(); subs.set.forEach(cb => cb(db.settings)); },
    resetDemo: () => { try { localStorage.removeItem(KEY); } catch {} location.reload(); }
  };
}

async function firebaseBackend() {
  const V = "10.14.1", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
  ]);
  const app = initializeApp(CONFIG.firebase);
  const auth = A.getAuth(app), fs = F.getFirestore(app);
  const col = (id, name) => F.collection(fs, "cycles", id, name);
  let user = null;
  return {
    demo: false,
    init: onUser => {
      A.onAuthStateChanged(auth, u => {
        if (!u) { A.signInAnonymously(auth).catch(e => { console.error(e); toast("Could not connect. Refresh to try again."); }); return; }
        user = u;
        const isAdmin = !u.isAnonymous && u.email && u.email.toLowerCase() === CONFIG.adminEmail.toLowerCase();
        onUser({ uid: u.uid, isAdmin });
      });
    },
    onSettings: cb => F.onSnapshot(F.doc(fs, "settings", "main"), d => cb(d.exists() ? d.data() : { paused: false, message: "" }), e => { console.error(e); cb({ paused: false }); }),
    onSuggestions: (id, admin, cb) => {
      const q = admin ? col(id, "suggestions") : F.query(col(id, "suggestions"), F.where("hidden", "==", false));
      return F.onSnapshot(q, snap => cb(snap.docs.map(d => {
        const x = d.data(); return { id: d.id, ...x, createdAt: x.createdAt?.toMillis?.() ?? Date.now() };
      })), e => { console.error(e); cb([]); });
    },
    onVotes: (id, cb) => F.onSnapshot(col(id, "votes"), snap => {
      const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); cb(o);
    }, e => { console.error(e); cb({}); }),
    addSuggestion: (id, text, name) => F.addDoc(col(id, "suggestions"), { text, name, uid: user.uid, hidden: false, createdAt: F.serverTimestamp() }),
    vote: (id, sid) => F.setDoc(F.doc(fs, "cycles", id, "votes", user.uid), { sid, at: F.serverTimestamp() }),
    setHidden: (id, sid, hidden) => F.updateDoc(F.doc(fs, "cycles", id, "suggestions", sid), { hidden }),
    remove: (id, sid) => F.deleteDoc(F.doc(fs, "cycles", id, "suggestions", sid)),
    saveSettings: st => F.setDoc(F.doc(fs, "settings", "main"), st, { merge: true }),
    signInAdmin: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()).catch(e => { console.error(e); toast("Sign in did not finish."); }),
    signOut: () => A.signOut(auth)
  };
}

/* ---------- state ---------- */
const params = new URLSearchParams(location.search);
const S = {
  be: null, uid: null, isAdmin: false, demoAdmin: false,
  settings: { paused: false, message: "" },
  cycle: null, override: DEMO ? params.get("phase") : null,
  suggestions: null, votes: null, unsub: [], lastKey: ""
};
const phaseOf = () => S.override || S.cycle.phase;
const admin = () => S.isAdmin || S.demoAdmin;

function subscribeCycle() {
  S.unsub.forEach(u => u && u()); S.unsub = [];
  S.suggestions = null; S.votes = null;
  const id = S.cycle.id;
  S.unsub.push(S.be.onSuggestions(id, admin(), list => { S.suggestions = list.sort((a, b) => a.createdAt - b.createdAt); render(); }));
  S.unsub.push(S.be.onVotes(id, v => { S.votes = v; render(); }));
}

function tally() {
  const counts = {}; let total = 0;
  const visible = new Set((S.suggestions || []).filter(s => !s.hidden).map(s => s.id));
  for (const v of Object.values(S.votes || {})) if (visible.has(v.sid)) { counts[v.sid] = (counts[v.sid] || 0) + 1; total++; }
  return { counts, total, mine: S.votes?.[S.uid]?.sid };
}

/* ---------- countdown + header ---------- */
let lastDigits = {};
function renderClock(now) {
  const c = S.cycle, ph = phaseOf();
  const card = $("#countCard");
  if (S.settings.paused) { card.style.display = "none"; return; }
  card.style.display = "";
  let target, label, sub;
  if (ph === "suggest") { target = c.voteStart; label = "Voting opens in"; sub = `${dayLabel(c.sat - 3)} · 6:00 PM CT`; }
  else if (ph === "vote") { target = c.voteEnd; label = "Voting closes in"; sub = `${dayLabel(c.sat - 2)} · 6:00 PM CT`; }
  else if (ph === "results") { target = c.liveStart; label = "Midrash goes live in"; sub = `${dayLabel(c.sat)} · 6:30 PM CT`; }
  else { card.style.display = "none"; return; }
  if (S.override) target = now + ({ suggest: 2 * 86400000 + 5e6, vote: 7.2e7, results: 1.6e8 }[ph] || 0) - (now % 1000);
  let d = Math.max(0, target - now);
  const vals = { days: Math.floor(d / 86400000), hours: Math.floor(d / 3600000) % 24, mins: Math.floor(d / 60000) % 60, secs: Math.floor(d / 1000) % 60 };
  if (card.dataset.k !== ph) {
    card.dataset.k = ph; lastDigits = {};
    card.replaceChildren(
      h("div", { class: "count-label", text: label }),
      h("div", { class: "clock" }, ...Object.keys(vals).map(k => h("div", { class: "unit" }, h("div", { class: "digit", id: "d-" + k, text: "--" }), h("small", { text: k })))),
      h("div", { class: "count-target", text: sub })
    );
  }
  for (const [k, v] of Object.entries(vals)) {
    const s = String(v).padStart(2, "0"), el = $("#d-" + k);
    if (el && lastDigits[k] !== s) { el.textContent = s; if (lastDigits[k] != null) { el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); } lastDigits[k] = s; }
  }
  if (!S.override && d === 0) setTimeout(tickNow, 1200);
}
function renderPill() {
  const ph = phaseOf();
  const map = S.settings.paused ? ["", "TAKING A BREAK"] : {
    suggest: ["", "SUGGESTIONS OPEN"], vote: ["vote", "VOTING IS LIVE"],
    results: ["results", "THE VOTES ARE IN"], live: ["live", "WE'RE LIVE NOW"]
  }[ph];
  $("#pill").replaceChildren(h("span", { class: "pill " + map[0] }, h("span", { class: "dot" }), map[1]));
  const order = ["suggest", "vote", "results"];
  const idx = ph === "live" ? 3 : order.indexOf(ph);
  const c = S.cycle;
  const steps = [
    ["Suggest", `Until Wed 6 PM`],
    ["Vote", "Wed 6 PM to Thu 6 PM"],
    ["Midrash", `Sat ${dayLabel(c.sat).split(", ")[1]} · 6:30 PM`]
  ];
  $("#steps").style.display = S.settings.paused ? "none" : "";
  $("#steps").replaceChildren(...steps.map(([b, s], i) => h("div", { class: "step" + (i === idx || (idx === 3 && i === 2) ? " on" : i < idx ? " done" : "") }, h("b", { text: b }), h("span", { text: s }))));
}

/* ---------- main panels ---------- */
function joinLinks() {
  const L = CONFIG.links;
  return h("div", { class: "links" },
    h("a", { class: "yt", href: L.youtube, target: "_blank", rel: "noopener" }, h("span", { text: "▶" }), "YouTube"),
    h("a", { class: "fb", href: L.facebook, target: "_blank", rel: "noopener" }, h("span", { text: "f" }), "Facebook"),
    h("a", { class: "zm", href: L.zoom, target: "_blank", rel: "noopener" }, h("span", { text: "🎥" }), "Zoom"));
}
function shareBtn(text) {
  return h("button", { class: "btn ghost share", type: "button", onclick: async () => {
    const data = { title: "Midrash Topic Vote", text, url: location.origin + location.pathname };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast("Link copied 📋"); } } catch {}
  } }, "📣 Share with a friend");
}

function panelSuggest() {
  const list = S.suggestions || [];
  const mineCount = list.filter(s => s.uid === S.uid).length;
  const max = CONFIG.maxSuggestionsPerPerson;
  const card = h("section", { class: "card" },
    h("h2", { text: "What should we study?" }),
    h("p", { class: "lead", text: "Drop a topic, a question, or a passage you want us to dig into together. Voting opens Wednesday at 6 PM CT." }));
  if (mineCount >= max && !admin()) {
    card.append(h("div", { class: "notice", text: `You've added ${max} topics this round. Thank you! 🙌 Come back Wednesday at 6 PM CT to vote.` }));
  } else {
    const ta = h("textarea", { maxlength: "140", placeholder: "Example: How do I forgive family who hurt me?", "aria-label": "Your topic" });
    const nm = h("input", { type: "text", maxlength: "40", placeholder: "Your name (optional)", "aria-label": "Your name" });
    const cnt = h("span", { text: "0 / 140" });
    const btn = h("button", { class: "btn", type: "submit", disabled: true }, "Submit my topic 🔥");
    ta.addEventListener("input", () => { cnt.textContent = `${ta.value.length} / 140`; btn.disabled = ta.value.trim().length < 3; });
    const form = h("form", { onsubmit: async e => {
      e.preventDefault();
      const text = ta.value.trim().replace(/\s+/g, " "), name = nm.value.trim();
      if (text.length < 3) return;
      if (list.some(s => s.text.toLowerCase() === text.toLowerCase())) { toast("That topic is already on the list 👍"); return; }
      btn.disabled = true;
      try { await S.be.addSuggestion(S.cycle.id, text, name); ta.value = ""; cnt.textContent = "0 / 140"; toast("Topic added! 🙌"); burst(40); }
      catch (err) { console.error(err); toast("That did not go through. Try again."); btn.disabled = false; }
    } }, ta, h("div", { class: "meta" }, h("span", { text: admin() ? "Admin: no limit" : `${max - mineCount} left this round` }), cnt), nm, btn);
    card.append(form);
  }
  card.append(h("h3", { text: `Topics so far (${list.filter(s => !s.hidden).length})` }));
  const visible = list.filter(s => !s.hidden);
  card.append(visible.length ? h("div", { class: "list" }, ...visible.map(s => h("div", { class: "item" },
    h("div", { class: "t", text: "📖 " + s.text }),
    h("div", { class: "by", text: s.name ? `Suggested by ${s.name}` : "Suggested anonymously" }))))
    : h("div", { class: "empty", text: "No topics yet. Be the first! ✨" }));
  card.append(shareBtn("Help pick the next Kingdom Life Midrash topic! Suggest yours here:"));
  return card;
}

function optionList(clickable) {
  const list = (S.suggestions || []).filter(s => !s.hidden);
  const { counts, total, mine } = tally();
  const reveal = !clickable || !!mine;
  const sorted = reveal ? [...list].sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0)) : list;
  return h("div", { class: "list" }, ...sorted.map(s => {
    const n = counts[s.id] || 0, pct = total ? Math.round(n * 100 / total) : 0;
    const fill = h("div", { class: "fill" });
    if (reveal) requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = pct + "%"));
    return h(clickable ? "button" : "div", { class: "opt" + (mine === s.id ? " mine" : ""), type: clickable ? "button" : null,
      onclick: clickable ? async () => {
        if (mine === s.id) return;
        try { await S.be.vote(S.cycle.id, s.id); toast(mine ? "Vote changed ✅" : "Vote counted! 🎉"); if (!mine) burst(120); }
        catch (err) { console.error(err); toast("Vote did not go through. Try again."); }
      } : null },
      fill,
      clickable ? h("span", { class: "radio", text: mine === s.id ? "✓" : "" }) : null,
      h("div", { class: "row" }, h("span", { class: "t", text: s.text }), reveal ? h("span", { class: "pct", text: pct + "%" }) : null),
      h("div", { class: "by", style: "font-size:12px;color:var(--muted);margin-top:4px", text: (s.name ? s.name : "Anonymous") + (reveal ? ` · ${n} vote${n === 1 ? "" : "s"}` : "") }));
  }));
}

function panelVote() {
  const list = (S.suggestions || []).filter(s => !s.hidden);
  const { total, mine } = tally();
  const card = h("section", { class: "card" },
    h("h2", { text: mine ? "Your vote is in! 🎉" : "Cast your vote" }),
    h("p", { class: "lead", text: mine ? "Here's how it's looking. You can change your vote until Thursday at 6 PM CT." : "Tap the topic you want most. One vote each, and you can change it until Thursday at 6 PM CT." }));
  if (!list.length) { card.append(h("div", { class: "empty", text: "No topics were suggested this round." })); return card; }
  card.append(h("div", { style: "margin-top:14px" }, optionList(true)));
  if (mine) card.append(h("div", { class: "total", text: `${total} vote${total === 1 ? "" : "s"} so far` }));
  card.append(shareBtn("Voting is open for the next Kingdom Life Midrash topic! Cast your vote:"));
  return card;
}

function winners() {
  const list = (S.suggestions || []).filter(s => !s.hidden);
  const { counts, total } = tally();
  const top = Math.max(0, ...list.map(s => counts[s.id] || 0));
  return { w: top > 0 ? list.filter(s => (counts[s.id] || 0) === top) : [], top, total };
}

function panelResults() {
  const { w, top, total } = winners();
  const card = h("section", { class: "card" });
  if (!w.length) {
    card.append(h("h2", { text: "No votes this round" }), h("p", { class: "lead", text: "Join us Saturday at 6:30 PM CT and bring your questions." }), joinLinks());
    return card;
  }
  card.append(h("div", { class: "winner" },
    h("div", { class: "crown", text: "👑" }),
    h("div", { class: "lbl", text: w.length > 1 ? "It's a tie!" : "This Saturday's topic" }),
    ...w.map(s => h("div", { class: "topic", text: s.text })),
    h("div", { class: "v", text: `${top} of ${total} votes${w.length > 1 ? " each" : ""}` + (w.length === 1 && w[0].name ? ` · suggested by ${w[0].name}` : "") })));
  card.append(h("h3", { text: "Join us live Saturday 6:30 PM CT" }), joinLinks());
  card.append(h("h3", { text: "Final results" }), optionList(false));
  card.append(shareBtn("The votes are in for this Saturday's Kingdom Life Midrash! See the topic:"));
  return card;
}

function panelLive() {
  const { w } = winners();
  return h("section", { class: "card livebig" },
    h("div", { class: "rec" }, h("i"), "LIVE NOW"),
    w.length ? h("div", { class: "winner", style: "margin-top:18px" }, h("div", { class: "lbl", text: "Tonight's topic" }), ...w.map(s => h("div", { class: "topic", text: s.text }))) : null,
    h("h3", { text: "Jump in" }), joinLinks(),
    h("p", { class: "lead", style: "margin-top:16px", text: "Suggestions for the next topic open right after tonight's Midrash." }));
}

function panelPaused() {
  return h("section", { class: "card", style: "text-align:center" },
    h("div", { style: "font-size:44px", text: "🕊️" }),
    h("h2", { text: "Taking a short break" }),
    h("p", { class: "lead", text: S.settings.message || "Topic voting is paused for now. Check back soon!" }));
}

/* ---------- admin ---------- */
function panelAdmin() {
  if (!admin()) return null;
  const list = S.suggestions || [];
  const { counts } = tally();
  const chk = h("input", { type: "checkbox" }); chk.checked = !!S.settings.paused;
  const msg = h("input", { type: "text", maxlength: "160", placeholder: "Pause message (example: Back after the Oahu trip!)" }); msg.value = S.settings.message || "";
  return h("section", { class: "card admin" },
    h("h2", { text: "🛠 Admin" }),
    h("p", { class: "lead", text: `Round: topic Midrash on ${S.cycle.id}. Hidden topics disappear for everyone.` }),
    h("label", {}, chk, "Pause voting (show a break message)"), msg,
    h("button", { class: "btn sm", type: "button", style: "margin-top:10px", onclick: async () => {
      try { await S.be.saveSettings({ paused: chk.checked, message: msg.value.trim() }); toast("Saved ✅"); } catch (e) { console.error(e); toast("Save failed"); }
    } }, "Save"),
    h("h3", { text: `All suggestions (${list.length})` }),
    ...(list.length ? list.map(s => h("div", { class: "arow" + (s.hidden ? " hid" : "") },
      h("span", { class: "t", text: `${s.text} (${counts[s.id] || 0})` }),
      h("button", { class: "btn sm ghost", type: "button", onclick: () => S.be.setHidden(S.cycle.id, s.id, !s.hidden) }, s.hidden ? "Show" : "Hide"),
      h("button", { class: "btn sm ghost", type: "button", onclick: () => { if (confirm("Delete this suggestion for good?")) S.be.remove(S.cycle.id, s.id); } }, "Delete")))
      : [h("div", { class: "empty", text: "Nothing yet." })]),
    S.be.demo ? null : h("button", { class: "btn sm ghost", type: "button", style: "margin-top:14px", onclick: () => S.be.signOut() }, "Sign out"));
}

/* ---------- render ---------- */
function render() {
  if (!S.cycle) return;
  renderPill();
  const ph = phaseOf();
  const main = $("#main");
  if (S.suggestions == null || S.votes == null) main.replaceChildren(h("div", { class: "card loading", text: "Loading…" }));
  else if (S.settings.paused) main.replaceChildren(panelPaused());
  else main.replaceChildren({ suggest: panelSuggest, vote: panelVote, results: panelResults, live: panelLive }[ph]());
  $("#adminBox").replaceChildren(...[panelAdmin()].filter(Boolean));
  renderDemoBar();
}

function tickNow() {
  const now = Date.now();
  const c = computeCycle(now);
  const key = c.id + c.phase;
  if (!S.cycle || c.id !== S.cycle.id) { S.cycle = c; subscribeCycle(); }
  else S.cycle = c;
  if (key !== S.lastKey) { S.lastKey = key; render(); }
  renderClock(now);
}

function renderDemoBar() {
  const bar = $("#demoBar");
  if (!DEMO) { bar.replaceChildren(); return; }
  const cur = phaseOf();
  bar.className = "demo";
  bar.replaceChildren(
    h("div", { text: "PREVIEW MODE: sample topics, saved only on this device. Connect Firebase to go live." }),
    h("div", { class: "sw" },
      ...["suggest", "vote", "results", "live"].map(p => h("button", { class: p === cur ? "on" : "", type: "button", onclick: () => {
        S.override = p; history.replaceState(null, "", "?phase=" + p); render(); renderClock(Date.now());
      } }, p)),
      h("button", { class: S.demoAdmin ? "on" : "", type: "button", onclick: () => { S.demoAdmin = !S.demoAdmin; subscribeCycle(); } }, "admin"),
      h("button", { type: "button", onclick: () => S.be.resetDemo() }, "reset")));
}

/* ---------- effects ---------- */
const cf = $("#confetti"), cx = cf.getContext("2d");
let parts = [], cfRun = false;
function burst(n) {
  const W = cf.width = innerWidth * devicePixelRatio, H = cf.height = innerHeight * devicePixelRatio;
  const cols = ["#f5c542", "#ffdf7e", "#7b3fe4", "#b28dff", "#2f7bff", "#ffffff", "#3ddc97"];
  for (let i = 0; i < n; i++) parts.push({ x: W / 2, y: H * .45, vx: (Math.random() - .5) * 22 * devicePixelRatio, vy: (-Math.random() * 18 - 6) * devicePixelRatio,
    s: (4 + Math.random() * 6) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0 });
  if (!cfRun) { cfRun = true; requestAnimationFrame(stepCf); }
}
function stepCf() {
  cx.clearRect(0, 0, cf.width, cf.height);
  parts.forEach(p => { p.vy += .55 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  parts = parts.filter(p => p.y < cf.height + 40 && p.life < 240);
  if (parts.length) requestAnimationFrame(stepCf); else { cfRun = false; cx.clearRect(0, 0, cf.width, cf.height); }
}
(function sparks() {
  const c = $("#sparks"), g = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W, H, dots = [];
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; dots = Array.from({ length: Math.min(60, Math.floor(W / 12)) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4, v: Math.random() * .35 + .1, a: Math.random() * Math.PI * 2 })); };
  size(); addEventListener("resize", size);
  (function loop() {
    g.clearRect(0, 0, W, H);
    for (const d of dots) { d.y -= d.v; d.a += .02; if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
      g.globalAlpha = .35 + Math.sin(d.a) * .3; g.fillStyle = "#ffe7a3"; g.beginPath(); g.arc(d.x + Math.sin(d.a) * 6, d.y, d.r, 0, 7); g.fill(); }
    requestAnimationFrame(loop);
  })();
})();

/* ---------- boot ---------- */
$("#adminBtn").addEventListener("click", () => {
  if (DEMO) { S.demoAdmin = !S.demoAdmin; subscribeCycle(); return; }
  if (S.isAdmin) { $("#adminBox").scrollIntoView({ behavior: "smooth" }); return; }
  S.be.signInAdmin();
});
(async () => {
  try { S.be = DEMO ? demoBackend() : await firebaseBackend(); }
  catch (e) { console.error(e); $("#main").replaceChildren(h("div", { class: "card empty", text: "Could not load. Check your connection and refresh." })); return; }
  S.be.onSettings(st => { S.settings = st || { paused: false }; S.lastKey = ""; if (S.cycle) { render(); renderClock(Date.now()); } });
  S.be.init(u => {
    const adminChanged = u.isAdmin !== S.isAdmin;
    S.uid = u.uid; S.isAdmin = u.isAdmin;
    if (!S.cycle) { tickNow(); setInterval(tickNow, 1000); }
    else if (adminChanged) subscribeCycle(); else render();
  });
})();
</script>
